name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — catches newly disclosed advisories against unchanged deps
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node (for npm audit)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Generate an npm-style lockfile from package.json so `npm audit` can run
      # without changing the project's primary package manager (Bun).
      - name: Generate npm lockfile for audit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Run npm audit and save report
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore

      - name: Fail only on critical vulnerabilities (temporary)
        run: |
          node -e "try { 
            const r = require('./npm-audit-report.json');
            const vuln = (r.metadata || {}).vulnerabilities || {};
            const critical = vuln.critical || 0;
            if (critical > 0) {
              console.error('Found', critical, 'critical vulnerabilities');
              process.exit(1);
            } else {
              console.log('No critical vulnerabilities found.');
            }
          } catch (e) {
            console.error('Failed to parse npm-audit-report.json:', e);
            process.exit(1);
          }"

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # Fail the build on high-severity (error) alerts.
          upload: always

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
