name: Admin Access Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Secrets are empty strings for pull_request runs from forks, which is
      # the supported way to skip the signed-in branches. The vitest suite
      # uses describe.skipIf(!hasAdmin/!hasUser) so missing creds are a no-op.
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun (with retries)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: curl -fsSL https://bun.sh/install | bash && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Registry connectivity healthcheck
        timeout-minutes: 2
        run: |
          probe() {
            name="$1"; url="$2"
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --location --max-time 10 -o /dev/null "$url"; then
                echo "$name reachable"
                return 0
              fi
              echo "$name probe failed (attempt $attempt)"
              [ "$attempt" -lt 3 ] && sleep 5
            done
            echo "::error::$name unreachable at $url - failing fast before dependency installation"
            return 1
          }
          probe "npm registry" "https://registry.npmjs.org/-/ping"
          probe "bun.sh" "https://bun.sh"
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Tool versions ==="
          echo "bun: $(bun --version 2>&1 || echo 'unavailable')"
          echo "node: $(node --version 2>&1 || echo 'unavailable')"
          echo "npm: $(npm --version 2>&1 || echo 'unavailable')"
          echo "=== Runner ==="
          echo "os: $RUNNER_OS / $RUNNER_ARCH, image: $ImageOS $ImageVersion"
          echo "=== Last install output (tail) ==="
          if [ -f install.log ]; then tail -n 100 install.log; else echo "no install.log captured"; fi
      - name: Install dependencies (with backoff)
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile 2>&1 | tee install.log; then
              exit 0
            fi
            echo "bun install failed (attempt $attempt). Retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "bun install failed after 3 attempts"
          exit 1
      - name: Report which branches will run
        run: |
          echo "Anon branch: always runs"
          if [ -n "$TEST_ADMIN_EMAIL" ] && [ -n "$TEST_ADMIN_PASSWORD" ]; then
            echo "Admin branch: will run"
          else
            echo "Admin branch: SKIPPED (secrets unavailable, e.g. fork PR)"
          fi
          if [ -n "$TEST_USER_EMAIL" ] && [ -n "$TEST_USER_PASSWORD" ]; then
            echo "Non-admin user branch: will run"
          else
            echo "Non-admin user branch: SKIPPED (secrets unavailable, e.g. fork PR)"
          fi
      - name: Run admin-access vitest suite
        run: bunx vitest run src/test/admin-access.test.ts
